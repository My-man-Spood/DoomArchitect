// Real ZDoom/GZDoom Hexen-style "generic" linedef actions - the kind that
// genuinely take arg0-arg4 arguments (unlike vanilla Doom's own 38 classic
// actions in VanillaCommon.cfg, whose speed/height/delay are hardcoded
// into the action *number* itself, not passed as separate arguments -
// arg0-arg4 is a Hexen/UDMF-only concept). Confirmed directly against
// real GZDoom/UDB behavior that a UDMF-format map's own linedeftypes are
// this generic/Hexen-style action table, not a reinterpretation of the
// classic vanilla-numbered specials (which use an entirely different,
// incompatible encoding scheme) - so this file is deliberately NOT merged
// with VanillaCommon.cfg's own linedeftypes, and is only ever included by
// a UDMF-format configuration. Authored fresh from public, decades-
// established ZDoom/GZDoom engine knowledge (action numbers and their
// arg order/meaning are objective engine facts, safe to reproduce
// exactly) - not copied from UDB's own bundled .cfg data, which carries a
// different license than this repository (see TODO.md). An intentionally
// partial starter set covering the most common generic actions, not
// every one GZDoom defines - matches this project's own established
// partial-starter-set convention for bundled .cfg data.

linedeftypes
{
	doors
	{
		10
		{
			title = "Door close (tag-targeted)";
			arg0 { title = "Sector Tag"; }
