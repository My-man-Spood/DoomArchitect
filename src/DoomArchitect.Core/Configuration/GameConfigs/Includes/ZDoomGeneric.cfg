// Real ZDoom/GZDoom Hexen-style "generic" linedef actions - the kind that
// genuinely take arg0-arg4 arguments (unlike vanilla Doom's own 38 classic
// actions in VanillaCommon.cfg, whose speed/height/delay are hardcoded
// into the action *number* itself, not passed as separate arguments -
// arg0-arg4 is a Hexen/UDMF-only concept). Confirmed directly against
// real GZDoom/UDB behavior that a UDMF-format map's own linedeftypes are
// this generic/Hexen-style action table, not a reinterpretation of the
// classic vanilla-numbered specials (which use an entirely different,
// incompatible encoding scheme) - so this file is deliberately NOT merged
// with VanillaCommon.cfg's own linedeftypes, and is only ever included by
// a UDMF-format configuration. Authored fresh from public, decades-
// established ZDoom/GZDoom engine knowledge - action numbers, real engine
// argument order, and enum values are objective engine facts, safe to
// reproduce exactly, but every title/description string below is
// independently phrased, not copied or closely paraphrased from UDB's own
// actual .cfg data (which carries a different license than this
// repository - see TODO.md).
//
// A near-complete real action table (191 entries across every category
// GZDoom's own real Hexen/UDMF linedef-action set defines: doors, floors,
// ceilings, stairs, pillars, platforms/lifts, polyobjects, teleports,
// things, scrollers, lighting, earthquakes, scripts, sectors, lines,
// exits, and misc/use), not the earlier hand-picked 12-action starter set
// - an initial pass under-scoped this file relative to what a real
// GZDoom UDMF configuration actually exposes in its own action browser,
// caught and corrected once flagged. A small number of genuinely
// catalog-shaped arguments (e.g. Thing_SpawnFacing's projectile-class
// argument, Thing_Spawn's actor-class argument) are deliberately left as
// plain numeric fields rather than enum dropdowns - GZDoom itself has no
// single fixed value list for these, since the real choices come from
// each IWAD/game's own loaded actor definitions, which this project has
// no such catalog for yet (same gap already noted for the Thing property
// dialog, which doesn't exist in this project yet either).

