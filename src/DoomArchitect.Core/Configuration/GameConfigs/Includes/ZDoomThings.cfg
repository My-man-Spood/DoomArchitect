// for accuracy, not typed from memory. See DoomThings.cfg's own
// remarks (and TODO.md) for the fuller provenance reasoning
// already established for this project's bundled configs -
// including why thing titles are copied verbatim here (they're
// short factual labels, not creative prose - there's really only
// one correct English name for most of these).

// Two named sub-blocks, selected individually by GZDoomDoom2UDMF.cfg's
// own thingtypes include() calls - matches UDB's own real file shape
// exactly (ZDoom_things.cfg's own real "doom"/"zdoom" split): "doom"
// is ZDoom's own additions available only in Doom-compatible game
// modes; "zdoom" is the fully generic actor set available in any
// ZDoom-family game, which itself pulls in Boom's own 2 generic
// actors (Pusher/Puller) via a nested include() - mirroring UDB's own
// real nested include() inside its "zdoom" block precisely.

