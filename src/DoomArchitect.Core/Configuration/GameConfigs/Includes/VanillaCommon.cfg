// Vanilla Doom/Doom2 linedef actions and sector specials - identical
// between both games (Doom2 only ever adds new *thing* types, never new
// map-behavior specials), so this one file is shared by Doom.cfg and
// Doom2.cfg alike. Authored fresh from public, decades-established
// vanilla Doom engine knowledge - not copied from UDB's own bundled .cfg
// data, which carries a different license than this repository (see
// TODO.md). An intentionally partial starter set - the most common
// vanilla actions/specials, not an exhaustive listing of every one that
// ever shipped - nothing consumes this data yet (no property editing UI
// exists), so widening it is a follow-up, not a blocker.

