// Vanilla thing types shared by Doom and Doom2 - Doom2 only ever adds new
// entries on top of this roster (Doom2.cfg includes this file, then
// layers its own exclusive monsters/items into the same categories - the
// include() merge combines them automatically, see CfgLoader). Authored
// fresh from public, decades-established vanilla Doom engine knowledge -
// not copied from UDB's own bundled .cfg data (see TODO.md). "sprite" is
// a full sprite lump name (frame + rotation, e.g. "POSSA2A8" - a lump
// covering both mirrored rotations 2 and 8 in one image, the frame real
// UDB shows by default for most monsters), matching real UDB .cfg data.
// width/height/hangs values cross-checked against UDB's own real bundled
// Doom_things.cfg (~/Projects/ultimate-doom-builder-source) for accuracy -
// not just typed from memory. "arrow" (nonzero = show facing) mirrors
// UDB's own real field/semantics (verified in Source/Core/Config/
// ThingTypeInfo.cs) - false for anything that doesn't actually rotate in
// gameplay, so the 2D view can use a plain ring icon instead of a
// misleading directional one. "color" is a small palette index like
// UDB's own, but resolved against DoomArchitect's own color choices
// (Rendering.ThingCategoryColors), not UDB's actual editor color scheme -
// that palette is UDB's own UI design, not a vanilla-Doom fact.
//
// Category names/grouping (players/teleports/monsters/weapons/
// ammunition/health/powerups/keys/obstacles) match UDB's own real
// Doom_things.cfg exactly, cross-checked directly - notably, "Teleport
// landing" is its own "teleports" category, not part of "players" (an
// earlier version of this file had it wrong), and "health" splits from
// "powerups" (soul sphere/invulnerability/berserk/partial invisibility/
// radiation suit/computer area map/light amp visor are powerups, not
// health/armor pickups, despite some overlapping visual theme).

