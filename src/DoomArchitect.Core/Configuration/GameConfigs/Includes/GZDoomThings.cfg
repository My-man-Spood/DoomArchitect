// Authored fresh from public, well-established Doom/ZDoom/GZDoom
// engine data (DoomEd numbers, sprite lump names, dimensions,
// category grouping, thing titles) - cross-checked directly
// against UDB's own real bundled GZDoom_things.cfg
// for accuracy, not typed from memory. See DoomThings.cfg's own
// remarks (and TODO.md) for the fuller provenance reasoning
// already established for this project's bundled configs -
// including why thing titles are copied verbatim here (they're
// short factual labels, not creative prose - there's really only
// one correct English name for most of these).

// Two named sub-blocks, matching UDB's own real file shape exactly -
// "gzdoom" is GZDoom's own further generic-actor additions on top of
// ZDoom's own "zdoom" bucket (same category key, merges into it
// automatically - see CfgLoader's own same-key block merge);
// "gzdoom_lights" is GZDoom's real dynamic-light actor set. UDB's own
// real file also has a third, entirely commented-out "lightmaplights"
// category (an unfinished/disabled feature in UDB itself) - correctly
// omitted here since it was never actually active there either.

