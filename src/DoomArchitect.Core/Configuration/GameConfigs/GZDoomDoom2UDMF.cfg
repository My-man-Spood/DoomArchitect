// DoomArchitect's own bundled GZDoom "Doom in Hexen (UDMF)" game
// configuration, targeting Doom2's IWAD content. Authored fresh from
// public, well-established GZDoom/UDMF specification and engine facts
// (the real field names/numbers below are the actual public UDMF
// specification and GZDoom engine data, not creative expression) - not
// copied or closely derived from UDB's own actual bundled .cfg files,
// which carry a different license than this repository (see TODO.md and
// GameConfigurations.cs's own remarks for the fuller reasoning already
// established for the vanilla Doom/Doom2 configs).
//
// Thing types are deliberately reused from this project's existing
// vanilla Doom2 configuration for now (see the include() below) rather
// than GZDoom's own real, much larger table - that backs the Thing
// property dialog, which doesn't exist yet. Linedef *actions* are NOT
// reused from the vanilla configuration, unlike thing types - verified
// directly against real GZDoom/UDB behavior that a UDMF-format map's own
// linedef actions are the Hexen-style "generic" action table (real
// arg0-arg4 arguments, e.g. Door_Raise's own speed/delay), an entirely
// different, incompatible encoding from vanilla's own 38 classic actions
// (whose speed/height/delay are hardcoded into the action number itself,
// with no separate arguments at all - see Includes/VanillaCommon.cfg's
// own remarks). See Includes/ZDoomGeneric.cfg for that real, freshly
// authored generic action set. Sector-related data (flags, sector types,
// damage types) and the linedef flags/activations/enums below are real
// GZDoom/UDMF data, freshly described, since only a UDMF-format config
// actually has this UDMF-only concept at all (vanilla classic maps use a
// raw flags bitmask instead, not modeled this way).
//
// Sector types intentionally replace (not merge with) vanilla's own
// 16-entry table below - matches GZDoom's own real behavior: UDMF's
// sector-special numbering is an entirely independent namespace from
// vanilla Doom's, not an extension of it.

linedeftypes
{
	include("Includes/ZDoomGeneric.cfg", "linedeftypes");
}

thingtypes
{
	include("Doom2.cfg", "thingtypes");
}

