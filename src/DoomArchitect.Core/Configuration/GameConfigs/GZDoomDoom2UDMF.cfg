// DoomArchitect's own bundled GZDoom "Doom in Hexen (UDMF)" game
// configuration, targeting Doom2's IWAD content. Authored fresh from
// public, well-established GZDoom/UDMF specification and engine facts
// (the real field names/numbers below are the actual public UDMF
// specification and GZDoom engine data, not creative expression) - not
// copied or closely derived from UDB's own actual bundled .cfg files,
// which carry a different license than this repository (see TODO.md and
// GameConfigurations.cs's own remarks for the fuller reasoning already
// established for the vanilla Doom/Doom2 configs).
//
// Thing types are deliberately reused from this project's existing
// vanilla Doom2 configuration for now (see the include() below) rather
// than GZDoom's own real, much larger table - that backs the Thing
// property dialog, which doesn't exist yet. Linedef *actions* are NOT
// reused from the vanilla configuration, unlike thing types - verified
// directly against real GZDoom/UDB behavior that a UDMF-format map's own
// linedef actions are the Hexen-style "generic" action table (real
// arg0-arg4 arguments, e.g. Door_Raise's own speed/delay), an entirely
// different, incompatible encoding from vanilla's own 38 classic actions
// (whose speed/height/delay are hardcoded into the action number itself,
// with no separate arguments at all - see Includes/VanillaCommon.cfg's
// own remarks). See Includes/ZDoomGeneric.cfg for that real, freshly
// authored generic action set. Sector-related data (flags, sector types,
// damage types) and the linedef flags/activations/enums below are real
// GZDoom/UDMF data, freshly described, since only a UDMF-format config
// actually has this UDMF-only concept at all (vanilla classic maps use a
// raw flags bitmask instead, not modeled this way).
//
// Sector types intentionally replace (not merge with) vanilla's own
// 16-entry table below - matches GZDoom's own real behavior: UDMF's
// sector-special numbering is an entirely independent namespace from
// vanilla Doom's, not an extension of it.

linedeftypes
{
	include("Includes/ZDoomGeneric.cfg", "linedeftypes");
}

thingtypes
{
	include("Doom2.cfg", "thingtypes");
}

// Real per-sector UDMF boolean fields - the 9 fields the UDMF
// specification itself defines, plus 2 more GZDoom adds on top.
sectorflags
{
	silent = "Silent (no sounds cross into/out of this sector)";
	hidden = "Not shown on the textured automap";
	nofallingdamage = "No falling damage";
	waterzone = "Underwater and swimmable";
	norespawn = "Players can't respawn in this sector";
	dropactors = "Actors drop with instantly moving floors";
	damageterraineffect = "Spawns a terrain splash effect on damage";
	damagehazard = "Strife-style damage model";
	noattack = "Monsters in this sector won't attack";
	hurtmonsters = "Sector damage also hurts monsters";
	harminair = "Sector damage also hurts airborne actors";
}

// Known GZDoom damage-type identifiers - a fixed base list; a DECORATE
// parser could discover more from the loaded map's own actors, but this
// project doesn't have one yet.
damagetypes = "BFGSplash Drowning Slime Fire Crush Telefrag Falling Suicide Exit Melee Railgun Ice Disintegrate Poison PoisonCloud Electric Massacre DrainLife Extreme InstantDeath";

// Real per-linedef UDMF boolean fields - the base 10 the UDMF
// specification itself defines, plus the ZDoom/GZDoom namespace's own
// extensions on top.
linedefflags
{
	blocking = "Impassable";
	blockmonsters = "Blocks monsters";
	twosided = "Two-sided";
	dontpegtop = "Upper texture unpegged";
	dontpegbottom = "Lower texture unpegged";
	secret = "Shown as one-sided on the automap; counts as a secret when crossed";
	blocksound = "Blocks sound propagation";
	dontdraw = "Never shown on the automap";
	transparent = "Always shown on the automap";
	mapped = "Already shown on the automap from the start";
	blockeverything = "Blocks everything, including projectiles and hitscans";
	blockplayers = "Blocks players only";
	blocklandmonsters = "Blocks ground monsters but not flying ones";
	blockfloaters = "Blocks flying/floating monsters";
	blockprojectiles = "Blocks projectiles";
	blockhitscan = "Blocks hitscan attacks";
	blockuse = "Blocks the use action from passing through";
	blocksight = "Blocks monster line of sight";
	jumpover = "Players can jump over (a railing-style line)";
	clipmidtex = "Clips the two-sided middle texture to the opening";
	wrapmidtex = "Tiles the two-sided middle texture vertically instead of clipping it";
	midtex3dimpassible = "The 3D-floor middle texture blocks movement like a solid floor";
	midtex3d = "Uses the middle texture as a walkable 3D floor";
	monsteractivate = "Monsters can trigger this line's action";
	zoneboundary = "Separates reverb/audio zones";
	translucent = "Uses a translucent middle texture";
}

// Real per-linedef UDMF activation-trigger fields - distinct from the
// flags above (UDB's own dialog keeps them in a separate group too, even
// though both are just named UDMF booleans under the hood): these decide
// *when* the line's action fires, not how the line itself behaves.
linedefactivations
{
	playercross = "Player crosses";
	playeruse = "Player uses";
	monstercross = "Monster crosses";
	monsteruse = "Monster uses";
	impact = "Projectile impacts";
	playerpush = "Player pushes";
	monsterpush = "Monster pushes";
	missilecross = "Projectile crosses";
	repeatspecial = "Repeatable (can trigger more than once)";
	passuse = "Use action passes through to lines behind this one";
}

// Shared argument-value enums a linedef action's own arg0-arg4 metadata
// (see Includes/ZDoomGeneric.cfg's linedeftypes) can reference by name, so
// a speed/type list reused by several actions is only authored once. Real,
// well-established ZDoom/GZDoom engine constants (safe to reproduce
// exactly, not creative prose) - each door/floor/ceiling family genuinely
// uses its own distinct speed scale in the real engine, not one shared
// list, so they're kept as separate enums here too.
enums
{
	door_speeds
	{
		4 = "Animated";
		16 = "Slow";
		32 = "Normal";
		64 = "Fast";
		128 = "Turbo";
	}

	flat_speeds
	{
		8 = "Slow";
		16 = "Normal";
		32 = "Fast";
		64 = "Turbo";
	}

	plat_speeds
	{
		8 = "Slow";
		16 = "Normal";
		32 = "Fast";
		64 = "Turbo";
	}

	reset_tics
	{
		0 = "Never";
		35 = "1 second";
		70 = "2 seconds";
		105 = "3 seconds";
		140 = "4 seconds";
		150 = "Doom default";
		175 = "5 seconds";
		210 = "6 seconds";
		245 = "7 seconds";
		280 = "8 seconds";
		315 = "9 seconds";
		350 = "10 seconds";
	}

	delay_tics
	{
		0 = "No delay";
		35 = "1 second";
		70 = "2 seconds";
		105 = "3 seconds";
		140 = "4 seconds";
		175 = "5 seconds";
		210 = "6 seconds";
		245 = "7 seconds";
		280 = "8 seconds";
		315 = "9 seconds";
		350 = "10 seconds";
	}

	yesno
	{
		0 = "No";
		1 = "Yes";
	}
}

