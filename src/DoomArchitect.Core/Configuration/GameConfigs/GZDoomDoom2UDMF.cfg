// namespace's own 7 extensions on top (countsecret, nocount, class1-5).
// Verified directly against source rather than guessed - a first pass
// assumed skill1-16/class1-3 from general Doom-engine familiarity, which
// would have been wrong (the real UDMF spec only defines 8 skill levels
// and ZDoom only defines 5 player classes).
