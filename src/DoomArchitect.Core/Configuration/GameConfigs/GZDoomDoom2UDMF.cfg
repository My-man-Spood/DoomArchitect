// Shared argument-value enums a linedef action's own arg0-arg4 metadata
// (see Includes/ZDoomGeneric.cfg's linedeftypes) can reference by name, so
// a speed/type list reused by several actions is only authored once. Real,
// well-established ZDoom/GZDoom engine constants - the numeric values are
// objective engine facts, safe to reproduce exactly, but every label
// string is independently phrased, not copied from UDB's own actual .cfg
// data. A near-complete set covering every distinct value list referenced
// by the 191 real actions in Includes/ZDoomGeneric.cfg - each
// door/floor/ceiling/stairs/etc. family genuinely uses its own distinct
// speed scale in the real engine, not one shared list, so they're kept as
// separate enums here too, matching real GZDoom behavior.
//
// A handful of these real value lists are genuinely per-game in real
// GZDoom/UDB, not universal - it keeps separate enums_doom/enums_heretic/
// enums_hexen/enums_strife/enums_chex blocks (see ZDoom_misc.cfg) and each
// top-level game config layers its own on top of the shared base. This
// config only ever targets Doom2's IWAD content, so it only ships the
// Doom-context resolution, suffixed "_doom" so that's unambiguous rather
// than silently reused for a different game later. This distinction is
// the direct fix for a real shipped bug: an earlier pass named this
// config's key list plainly "keys" and (during a since-corrected research
// pass) filled it with Hexen's own puzzle-key names instead of Doom's real
// red/blue/yellow keycard/skull keys - flattening away the "which game's
// value list is this" information UDB's own real per-game blocks carry is
// exactly what let that slip through unnoticed. A future Hexen- or
// Heretic-format configuration must author its own distinctly-suffixed
// enum from that game's own real values (e.g. "keys_hexen"), never reuse
// "_doom" one.
