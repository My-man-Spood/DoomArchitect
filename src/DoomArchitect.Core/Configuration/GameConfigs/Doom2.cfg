// DoomArchitect's own bundled vanilla Doom2 game configuration. Doom2
// only ever adds new thing types on top of Doom's roster - it never
// removes or renumbers anything - so this includes the exact same shared
// tables Doom.cfg does, then layers its own exclusive monsters/items into
// the same categories those includes already define. The include() merge
// (see CfgLoader) combines them automatically, so entries here only need
// to state what's actually different - fields left unset (e.g. "height"
// on most of these monsters) inherit the shared category default.
// width/height/hangs cross-checked against UDB's own real bundled
// Doom2_things.cfg (~/Projects/ultimate-doom-builder-source).

include("Includes/VanillaCommon.cfg");
include("Includes/DoomThings.cfg");

thingtypes
{
	monsters
	{
		64 { title = "Arch-vile"; sprite = "VILEA2D8"; width = 20; }
		65 { title = "Chaingunner"; sprite = "CPOSA2"; width = 20; }
		66 { title = "Revenant"; sprite = "SKELA2D8"; width = 20; }
		67 { title = "Mancubus"; sprite = "FATTC2C8"; width = 48; height = 64; }
		68 { title = "Arachnotron"; sprite = "BSPIA2A8"; width = 64; height = 64; }
		69 { title = "Hell knight"; sprite = "BOS2A2C8"; width = 24; height = 64; }
		71 { title = "Pain elemental"; sprite = "PAINA2A8"; width = 31; }
		72 { title = "Commander Keen"; sprite = "KEENA0"; width = 16; height = 72; hangs = true; }
		84 { title = "Wolfenstein SS"; sprite = "SSWVA2"; width = 20; }
	}

	weapons
	{
		82 { title = "Super shotgun"; sprite = "SGN2A0"; }
	}

	// Megasphere is Doom2-exclusive in vanilla (confirmed via UDB's own
	// real config split - it's defined in Doom2_things.cfg, not
	// Doom_things.cfg), not shared - it belongs here, not in
	// Includes/DoomThings.cfg. It's a "powerups" entry, not "health",
	// matching UDB's own real category for it.
	powerups
	{
		83 { title = "Megasphere"; sprite = "MEGAA0"; height = 40; }
	}
}
