// DoomArchitect's own bundled vanilla Doom2 game configuration. Doom2
// only ever adds new thing types on top of Doom's roster - it never
// removes or renumbers anything - so this includes the exact same shared
// tables Doom.cfg does, then layers its own exclusive monsters/items on
// top via Includes/Doom2Things.cfg. The include() merge (see CfgLoader)
// combines same-keyed categories automatically, so Doom2Things.cfg only
// needs to state what's actually different - fields left unset (e.g.
// "height" on most of these monsters) inherit the shared category
// default. Cross-checked directly against UDB's own real bundled
// Doom2_things.cfg for accuracy, not typed from memory.

include("Includes/VanillaCommon.cfg");
include("Includes/DoomThings.cfg");

thingtypes
{
	include("Includes/Doom2Things.cfg", "thingtypes");
}
